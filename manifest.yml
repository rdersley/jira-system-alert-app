modules:
  scheduledTrigger:
    - key: monthly-system-alert-test
      function: monthly-test-scheduler
      interval: hour
  jira:issueAction:
    - key: system-alert-send
      resource: alert-ui-custom
      resolver:
        function: resolver
      title: Send System Alert
      viewportSize: large
      displayConditions:
        jiraExpression: "app.properties['system-alert-display'] != null && project.key == app.properties['system-alert-display'].projectKey && app.properties['system-alert-display'].priorities.includes(issue.priority.name)"
  jira:issuePanel:
    - key: system-alert-panel
      resource: panel-ui-custom
      resolver:
        function: resolver
      title: System Alert
      icon: "https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg"
      displayConditions:
        jiraExpression: "app.properties['system-alert-display'] != null && project.key == app.properties['system-alert-display'].projectKey && app.properties['system-alert-display'].priorities.includes(issue.priority.name)"
  jira:adminPage:
    - key: system-alert-admin
      resource: admin-ui-custom
      resolver:
        function: resolver
      layout: native
      title: System Alert Manager
  function:
    - key: resolver
      handler: secure-index.handler
    - key: monthly-test-scheduler
      handler: index.monthlyTestScheduler
      timeoutSeconds: 300

resources:
  - key: alert-ui-custom
    path: static/alert/dist
  - key: panel-ui-custom
    path: static/panel/dist
  - key: admin-ui-custom
    path: static/admin/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - write:servicedesk-request
    - storage:app
    - write:app-data:jira
    - manage:jira-configuration
  external:
    fetch:
      backend:
        - address: https://api.twilio.com
        - address: https://api.dublin.ie1.twilio.com
        - address: https://api.sendgrid.com
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/8c53b866-0bd4-46bf-ab53-f3de18378d6b
