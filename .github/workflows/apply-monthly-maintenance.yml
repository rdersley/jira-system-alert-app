name: Apply monthly test maintenance

on:
  push:
    branches:
      - fix/monthly-test-maintenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monthly-test-maintenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply maintenance patch
        run: node scripts/apply-monthly-maintenance.mjs
      - name: Install dependencies and sync version
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build admin Custom UI
        run: |
          npm --prefix static/admin ci
          npm --prefix static/admin run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Fix monthly scheduler and add manual test tools"
          git push origin HEAD:fix/monthly-test-maintenance
