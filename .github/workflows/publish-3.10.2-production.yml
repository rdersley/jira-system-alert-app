name: Publish System Alert Manager 3.10.2 production

on:
  push:
    branches:
      - ops/publish-3.10.2-production

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Run automated tests
        run: npm test
      - name: Build and audit Custom UI resources
        shell: bash
        run: |
          for dir in static/*; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then npm --prefix "$dir" ci; else npm --prefix "$dir" install; fi
              npm --prefix "$dir" audit --audit-level=high
              if node -e "const p=require('./$dir/package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm --prefix "$dir" run build; fi
            fi
          done
      - name: Install Forge CLI and lint
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment production
          forge lint
      - name: Confirm release version
        run: test "$(cat VERSION)" = "3.10.2"
      - name: Deploy to Forge production
        run: forge deploy --environment production --non-interactive
