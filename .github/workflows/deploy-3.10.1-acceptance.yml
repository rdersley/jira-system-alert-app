name: Deploy System Alert 3.10.1 acceptance

on:
  push:
    branches:
      - fix/monthly-test-maintenance
    paths:
      - .github/workflows/deploy-3.10.1-acceptance.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install dependencies and Forge CLI
        run: |
          npm ci
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Run tests
        run: npm test
      - name: Build Custom UI
        run: |
          for dir in static/*; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/package.json" ]; then
              npm --prefix "$dir" ci
              npm --prefix "$dir" audit --audit-level=high
              if node -e "const p=require('./$dir/package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm --prefix "$dir" run build; fi
            fi
          done
      - name: Forge lint
        run: forge lint
      - name: Deploy Forge app
        run: forge deploy --environment development --non-interactive
      - name: Upgrade Nuvriqo installation
        run: forge install --upgrade --site nuvriqo.atlassian.net --product jira --environment development --confirm-scopes --non-interactive
      - name: Verify TEST project
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then echo "Skipping Jira REST smoke check"; exit 0; fi
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://nuvriqo.atlassian.net/rest/api/3/project/TEST")
          test "$code" = "200" || (cat /tmp/project.json && exit 1)
