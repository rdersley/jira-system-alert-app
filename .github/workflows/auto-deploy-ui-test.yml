name: Auto Deploy & UI Test

on:
  push:
    branches: [automation/playwright-ui-tests]
  workflow_dispatch:

concurrency:
  group: system-alert-auto-deploy-ui
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_TEST_ISSUE_KEY: ${{ secrets.JIRA_TEST_ISSUE_KEY }}
      FORGE_SITE: nuvriqo.atlassian.net
      FORGE_ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        shell: bash
        env:
          JIRA_STORAGE_STATE_GZIP_B64: ${{ secrets.JIRA_STORAGE_STATE_GZIP_B64 }}
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
          test -n "$JIRA_BASE_URL" || (echo "Missing JIRA_BASE_URL" && exit 1)
          test -n "$JIRA_TEST_ISSUE_KEY" || (echo "Missing JIRA_TEST_ISSUE_KEY" && exit 1)
          test -n "$JIRA_STORAGE_STATE_GZIP_B64" || (echo "Missing JIRA_STORAGE_STATE_GZIP_B64" && exit 1)

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

      - name: Build app when defined
        shell: bash
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then
            npm run build
          elif [ -d static ]; then
            for dir in static/*; do
              [ -d "$dir" ] || continue
              [ -f "$dir/package.json" ] || continue
              if [ -f "$dir/package-lock.json" ]; then npm --prefix "$dir" ci; else npm --prefix "$dir" install; fi
              if node -e "const p=require('./$dir/package.json');process.exit(p.scripts&&p.scripts.build?0:1)"; then npm --prefix "$dir" run build; fi
            done
          fi

      - name: Install Forge CLI and lint
        shell: bash
        run: |
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment "$FORGE_ENVIRONMENT"
          forge lint

      - name: Deploy to Nuvriqo development
        run: forge deploy --environment "$FORGE_ENVIRONMENT" --non-interactive

      - name: Upgrade development installation
        shell: bash
        run: |
          if ! forge install --upgrade --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive; then
            echo "Upgrade was unavailable; attempting first development install"
            forge install --site "$FORGE_SITE" --product jira --environment "$FORGE_ENVIRONMENT" --confirm-scopes --non-interactive
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Jira authenticated browser state
        shell: bash
        env:
          JIRA_STORAGE_STATE_GZIP_B64: ${{ secrets.JIRA_STORAGE_STATE_GZIP_B64 }}
        run: |
          mkdir -p .auth
          printf '%s' "$JIRA_STORAGE_STATE_GZIP_B64" | base64 --decode | gzip --decompress > .auth/jira.json
          test -s .auth/jira.json
          node -e "JSON.parse(require('fs').readFileSync('.auth/jira.json','utf8')); console.log('Jira browser state restored')"

      - name: Allow Forge UI to settle
        run: sleep 10

      - name: Run deployed UI tests
        run: npm run e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
