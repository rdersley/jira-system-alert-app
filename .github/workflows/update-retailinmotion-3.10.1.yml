name: Update Retail inMotion System Alert 3.10.1

on:
  push:
    branches:
      - ops/update-retailinmotion-3.10.1-final

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install dependencies and Forge CLI
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Confirm application version
        run: |
          echo "Updating Retail inMotion worksite to System Alert Manager $(cat VERSION)"
          test "$(cat VERSION)" = "3.10.1"
      - name: Upgrade existing worksite installation
        run: forge install --upgrade --site retailinmotion.atlassian.net --product jira --environment development --confirm-scopes --non-interactive
