name: Sync System Alert 3.10.2 release

on:
  push:
    branches:
      - release/3.10.2-marketplace

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.10.2-marketplace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync release version markers
        run: node scripts/sync-version.mjs
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Build admin Custom UI
        run: |
          npm --prefix static/admin ci
          npm --prefix static/admin run build
      - name: Commit synced release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json static/admin/package.json static/alert/package.json static/panel/package.json src/index.js static/admin/src/main.js static/admin/src/setup-wizard.js
          if git diff --cached --quiet; then
            echo "No synced version changes"
            exit 0
          fi
          git commit -m "Sync System Alert Manager 3.10.2 version markers"
          git push origin HEAD:release/3.10.2-marketplace
