name: Fix System Alert 3.10.2 dependency audit

on:
  push:
    branches:
      - release/3.10.2-marketplace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.10.2-marketplace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe dependency audit fixes
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
          npm test
      - name: Build admin Custom UI
        run: |
          npm --prefix static/admin ci
          npm --prefix static/admin audit --audit-level=high
          npm --prefix static/admin run build
      - name: Commit dependency lock updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json static/admin/package.json static/admin/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Fix high severity dependency audit issue"
          git push origin HEAD:release/3.10.2-marketplace
